<title>AgriSphere AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar, six hash-routed views (home journey + the five AgriSphere challenges), bottom tab bar on phones.
   Palette: field-green ink on a green-tinted neutral, one rice-green accent, sun-yellow for money, water-blue for moisture. */
:root{
  --bg:#F1F5EE; --surface:#FFFFFF; --surface-2:#E6EEE2; --ink:#10251A; --muted:#52675A; --line:#D0DCCB;
  --accent:#1B7A3D; --accent-ink:#FFFFFF; --accent-soft:#D9EEDC;
  --sun:#855900; --sun-soft:#FAEFC9; --danger:#B3261E; --danger-soft:#F8DCD8; --water:#195E78; --water-soft:#D6EAF2;
  --leaf:#5aa65a;
  --shadow:0 1px 2px rgba(16,37,26,.06),0 8px 24px rgba(16,37,26,.06);
  --font-display:"Anek Bangla","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --font-body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1812; --surface:#15231A; --surface-2:#1C2E22; --ink:#E7F0E6; --muted:#9DB2A2; --line:#2A3E2F;
  --accent:#5CC47A; --accent-ink:#0B1A10; --accent-soft:#1D3A26;
  --sun:#F2B93B; --sun-soft:#3A2F12; --danger:#F29083; --danger-soft:#3C1D19; --water:#7CC3DE; --water-soft:#173340;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1812; --surface:#15231A; --surface-2:#1C2E22; --ink:#E7F0E6; --muted:#9DB2A2; --line:#2A3E2F;
  --accent:#5CC47A; --accent-ink:#0B1A10; --accent-soft:#1D3A26;
  --sun:#F2B93B; --sun-soft:#3A2F12; --danger:#F29083; --danger-soft:#3C1D19; --water:#7CC3DE; --water-soft:#173340;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);line-height:1.35;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(1.55rem,4.2vw,2.2rem);font-weight:800}
h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.nowrap{white-space:nowrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:800;font-size:1.15rem;flex:none}
.brand svg{width:30px;height:30px;color:var(--accent)}
.dnav{display:none;gap:2px;margin-left:auto}
.dnav a{display:flex;flex-direction:column;align-items:center;text-decoration:none;padding:6px 12px;border-radius:10px;line-height:1.25;color:var(--muted)}
.dnav a b{font-weight:600;font-size:.95rem;color:inherit}
.dnav a span{font-size:.7rem;opacity:.85}
.dnav a:hover{background:var(--surface-2)}
.dnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.demo-pill{margin-left:auto;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sun-soft);color:var(--sun);white-space:nowrap}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .wrap{display:grid;grid-template-columns:repeat(6,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 7px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:500;min-width:0}
.bnav a svg{width:22px;height:22px}
.bnav a[aria-current="page"]{color:var(--accent);font-weight:700}
@media (min-width:860px){.dnav{display:flex}.demo-pill{margin-left:12px}.bnav{display:none}}

main{padding-block:22px 110px;display:block}
@media (min-width:860px){main{padding-block:28px 48px}}
.stack{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.card h2{margin-bottom:10px}
.card > .lead{color:var(--muted);margin:-4px 0 12px;font-size:.92rem}

/* module header */
.mod-head{display:flex;flex-direction:column;gap:8px}
.tag{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-family:var(--font-display);font-weight:600;font-size:.82rem;letter-spacing:.02em;padding:3px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.mod-head p{color:var(--muted);max-width:62ch}
.pbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.pbar-items{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.92rem;min-width:0}
.pbar-items span+span::before{content:"·";margin-right:14px;color:var(--muted)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.sm{min-height:38px;padding:4px 12px;font-size:.92rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:4px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-height:40px;padding:4px 14px;border:0;background:transparent;cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.lbl{display:block;font-weight:600;margin:14px 0 6px;font-size:.92rem}
input[type=number],input[type=text],select{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1rem}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--sun-soft);color:var(--sun)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--water-soft);color:var(--water)}
.pill.plain{background:var(--surface-2);color:var(--muted)}

/* stats */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat .k{font-size:.82rem;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:1.45rem;line-height:1.3;font-variant-numeric:tabular-nums}
.stat .s{font-size:.78rem;color:var(--muted)}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hero .k,.stat.hero .s{color:inherit;opacity:.88}
.stat.neg .v{color:var(--danger)}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.82rem;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
tr.hl td{background:var(--accent-soft)}
.neg{color:var(--danger)} .pos{color:var(--accent)}

/* bars */
.rank{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(90px,.9fr) 3fr minmax(84px,auto);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:transparent;width:100%;text-align:left;cursor:pointer}
.rrow:hover{background:var(--surface-2)}
.rrow[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.rrow .nm{display:flex;flex-direction:column;gap:2px;font-weight:600;line-height:1.3}
.bar{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rrow.best .bar i{background:var(--accent)}
.rrow:not(.best) .bar i{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.rrow .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:520px){.rrow{grid-template-columns:1fr auto}.rrow .bar{grid-column:1/-1;grid-row:2}}

/* home */
.hero{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:stretch}
.hero-copy{display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero-copy p{color:var(--muted);font-size:1.05rem;max-width:54ch}
.farmer{display:flex;flex-direction:column;gap:12px}
.farmer dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.farmer dt{color:var(--muted);font-size:.9rem} .farmer dd{margin:0;font-weight:600}
.journey{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:48px 1fr;gap:4px 14px;padding:16px 0;position:relative}
.step + .step{border-top:1px dashed var(--line)}
.step .no{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.1rem}
.step .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.step .when{font-size:.82rem;color:var(--muted);font-weight:600}
.step .mt{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:4px}
.step .metric{font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--accent)}
.step .metric small{display:block;font-family:var(--font-body);font-weight:500;font-size:.78rem;color:var(--muted)}
.links{display:grid;gap:10px}
.links li{list-style:none;display:flex;gap:10px;align-items:flex-start}
.links{padding:0;margin:0}
.links svg{flex:none;width:18px;height:18px;margin-top:5px;color:var(--accent)}
.deal-strip{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:12px 16px}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:12px;background:var(--surface-2);text-align:center;min-width:0}
.day.alert{background:var(--water-soft)}
.day .dn{font-size:.8rem;font-weight:600}
.day .dt{font-family:var(--font-display);font-weight:700;font-size:1.02rem}
.day svg{width:26px;height:26px;color:var(--muted)}
.day.alert svg{color:var(--water)}
.rainbar{width:14px;height:56px;border-radius:7px;background:var(--surface);position:relative;overflow:hidden;border:1px solid var(--line)}
.rainbar i{position:absolute;left:0;right:0;bottom:0;background:var(--water)}
.day .rp{font-size:.78rem;font-weight:600;color:var(--water)}
.alerts{display:flex;flex-direction:column;gap:10px}
.alert-card{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.alert-card.high{background:var(--danger-soft)} .alert-card.mid{background:var(--sun-soft)}
.alert-card b{font-weight:700}
.meter{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.mid i{background:var(--sun)} .meter.high i{background:var(--danger)}
.sms{background:var(--surface-2);border-radius:16px 16px 16px 4px;padding:12px 14px;max-width:420px;font-size:.95rem;border:1px solid var(--line)}

/* zones */
.zones{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.zone{aspect-ratio:1.15;border-radius:6px;display:grid;place-items:center;font-size:.76rem;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid transparent}
.zone.dry{border:1.5px dashed var(--sun);font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* guardian */
.leafpanel{position:relative;background:var(--surface-2);border-radius:12px;display:grid;place-items:center;min-height:280px;overflow:hidden}
.leafpanel svg,.leafpanel img{max-height:270px;max-width:100%;width:auto}
.leafpanel img{border-radius:8px;object-fit:contain}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{top:8%}to{top:92%}}
.scanning-note{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-weight:700;color:var(--accent)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;gap:12px}
.kv h3{font-size:.9rem;color:var(--muted);font-weight:600;margin-bottom:2px;font-family:var(--font-body)}
.conf{display:flex;align-items:center;gap:10px}
.conf .meter{flex:1}

/* market */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tabs button{flex:none;min-height:44px;padding:4px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chartbox{width:100%;min-height:220px}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-txt{fill:var(--muted);font-size:11.5px;font-family:var(--font-body)}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round}
.ch-fc{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-dasharray:7 6}
.ch-band{fill:var(--accent);opacity:.14}
.ch-today{stroke:var(--muted);stroke-dasharray:3 4}
.ch-best{fill:var(--sun);stroke:var(--surface);stroke-width:2}
.ch-bt{fill:var(--sun);font-size:12px;font-weight:700;font-family:var(--font-body)}
.form-grid{display:grid;gap:4px 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.listing{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:start;padding:14px 0}
.listing + .listing{border-top:1px solid var(--line)}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;color:var(--accent);font-family:var(--font-display);font-weight:800;font-size:1.3rem}
.buyer{display:flex;flex-direction:column;gap:10px}
.buyer .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.buyer .nm{font-weight:700;font-family:var(--font-display)}
.offer{font-family:var(--font-display);font-weight:800;font-size:1.6rem;color:var(--accent);line-height:1.2}
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.hr{height:1px;background:var(--line);margin:4px 0}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}

/* modal + chat */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,16,11,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.x{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;cursor:pointer}
.chat{display:flex;flex-direction:column;height:min(86dvh,700px);padding:0;gap:0}
.chat-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.chat-b{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:.96rem;line-height:1.5;overflow-wrap:anywhere}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.sys{align-self:center;background:var(--sun-soft);color:var(--sun);font-weight:600;font-size:.85rem;max-width:94%;text-align:center}
.voice{display:flex;align-items:center;gap:10px}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.8}
.chat-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.chat-f form{display:flex;gap:8px}
.chat-f .chips .chip{min-height:36px;font-size:.88rem}
.typing{align-self:flex-start;color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:min(92vw,460px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.on{opacity:1}
@media (min-width:860px){.toast{bottom:28px}}
.foot{color:var(--muted);font-size:.82rem;padding-block:0 100px}
@media (min-width:860px){.foot{padding-bottom:36px}}
@media (prefers-reduced-motion:reduce){.scanline{animation:none;top:50%}.toast{transition:none}}
</style>

<header class="top">
  <div class="wrap topin">
    <a class="brand" href="#home" aria-label="AgriSphere AI হোম">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M16 25v-9"/><path d="M16 17c0-4 3-6.5 7-6.5 0 4-3 6.5-7 6.5z"/><path d="M16 19.5c0-3-2.2-5-6-5 0 3 2.2 5 6 5z"/></svg>
      <span>AgriSphere AI</span>
    </a>
    <nav class="dnav" id="dnav" aria-label="প্রধান মেনু"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="wrap foot">AI Builders Congress · Team 01 · AgriSphere AI</div>
<nav class="bnav" id="bnav" aria-label="নিচের মেনু"><div class="wrap"></div></nav>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(()=>{

const PCache={};
function priceData(crop,mk){
 const key=crop+'|'+mk; if(PCache[key])return PCache[key];
 const c=CROPS[crop],m=MARKETS[mk],r=rng(hash(key)),N=28,M=10,hist=[];
 for(let i=0;i<N;i++){const t=i-(N-1);hist.push(c.base*m.f*(1+c.trend*t+c.amp*Math.sin(2*Math.PI*t/7+c.ph)+(r()-.5)*.025));}
 let sx=0,sy=0,sxy=0,sxx=0;for(let i=0;i<N;i++){sx+=i;sy+=hist[i];sxy+=i*hist[i];sxx+=i*i;}
 const b=(N*sxy-sx*sy)/(N*sxx-sx*sx),a=(sy-b*sx)/N;
 const res=hist.map((v,i)=>v-(a+b*i)),sea=Array(7).fill(0),cnt=Array(7).fill(0);
 res.forEach((e,i)=>{sea[i%7]+=e;cnt[i%7]++;});for(let k=0;k<7;k++)sea[k]/=cnt[k];
 const sd=Math.sqrt(res.reduce((s,e,i)=>s+(e-sea[i%7])**2,0)/N),fc=[];
 for(let d=1;d<=M;d++){const i=N-1+d,v=a+b*i+sea[i%7],w=1.28*sd*Math.sqrt(1+d/4);fc.push({v,lo:v-w,hi:v+w});}
 return PCache[key]={hist,fc};
}

 return best;
}

function yieldCalc(crop=S.profile.crop,o={}){

 const yieldKg=p.land*c.yield*c.suit[p.soil]*YF[ys];
 const price=localPrice(crop)*PF[ps];
 const revenue=yieldKg*price,cost=p.land*c.cost,profit=revenue-cost;
 return {yieldKg,price,revenue,cost,profit,be:cost/yieldKg,roi:profit/cost};
}
function precCalc(){
 const p=S.profile,c=CROPS[p.crop],f=SOILF[p.soil],L=p.land;
 const rec={urea:c.fert.urea*f.u*L,tsp:c.fert.tsp*L,mop:c.fert.mop*f.k*L,gyp:c.fert.gyp*L};
 const PR={urea:27,tsp:27,mop:20,gyp:15};
 const cost=Object.keys(rec).reduce((s,k)=>s+rec[k]*PR[k],0);
 const typical=cost*1.25;

 return {rec,PR,cost,typical,saving:typical-cost,irr,gap:Math.round(c.days/irr)};
}

/* market */
function priceChart(crop,mk,W){
 const {hist,fc}=priceData(crop,mk),bd=bestDay(crop,mk);
 const H=Math.round(clamp(W*.5,230,320)),pl=40,pr=14,pt=22,pb=30,N=hist.length,M=fc.length,tot=N+M-1;
 const lo=[...hist,...fc.map(f=>f.lo)],hi=[...hist,...fc.map(f=>f.hi)];
 let mn=Math.min(...lo),mx=Math.max(...hi);const pad=(mx-mn)*.12||1;mn-=pad;mx+=pad;
 const x=i=>pl+(W-pl-pr)*i/tot,y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 let g='';
 for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+=`<line class="ch-grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-txt" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${bn(Math.round(v))}</text>`;}
 const marks=W<520?[[0,-(N-1)],[14,-(N-1)+14],[N-1,0],[N-1+M,M]]:[[0,-(N-1)],[7,-(N-1)+7],[14,-(N-1)+14],[21,-(N-1)+21],[N-1,0],[N-1+5,5],[N-1+M,M]];
 marks.forEach(([i,off],k)=>{g+=`<text class="ch-txt" x="${x(i)}" y="${H-8}" text-anchor="${k===0?'start':i===tot?'end':'middle'}">${off===0?'আজ':dstr(addDays(off))}</text>`;});
 const t0=N-1;
 const band=`M${x(t0)} ${y(hist[t0])}`+fc.map((f,i)=>` L${x(t0+i+1)} ${y(f.hi)}`).join('')+fc.slice().reverse().map((f,i)=>` L${x(t0+M-i)} ${y(f.lo)}`).join('')+` L${x(t0)} ${y(hist[t0])}Z`;
 const hp=hist.map((v,i)=>`${i?'L':'M'}${x(i)} ${y(v)}`).join(' ');
 const fp=`M${x(t0)} ${y(hist[t0])}`+fc.map((f,i)=>` L${x(t0+i+1)} ${y(f.v)}`).join('');
 const bi=t0+bd.d,bx=x(bi),by=y(bd.price);
 const bl=bd.d===0?'আজই সেরা':'সেরা দিন';
 const anchor=bx>W-70?'end':bx<pl+40?'start':'middle';
 return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto;display:block" role="img" aria-label="দামের ইতিহাস ও ১০ দিনের পূর্বাভাস">${g}
 <line class="ch-today" x1="${x(t0)}" x2="${x(t0)}" y1="${pt}" y2="${H-pb}"/>
 <path class="ch-band" d="${band}"/><path class="ch-line" d="${hp}"/><path class="ch-fc" d="${fp}"/>
 <circle class="ch-best" cx="${bx}" cy="${by}" r="6"/><text class="ch-bt" x="${bx}" y="${by-12}" text-anchor="${anchor}">${bl}</text></svg>`;
}
const curL=()=>S.listings.find(l=>l.id===S.selL)||S.listings[S.listings.length-1];

function logiOut(mk,qty){
 const km=DIST[S.profile.district].km[mk],rows=VEH.map(v=>{const trips=Math.ceil(qty/v[1]),cost=trips*v[2]*km+500*trips;return {n:v[0],cap:v[1],trips,cost};}),best=rows.reduce((a,b)=>b.cost<a.cost?b:a);
 return `<p class="small muted">${MARKETS[mk].bn} পর্যন্ত আনুমানিক ${km<=10?'কাছেই':bn(km)+' কিমি'}</p><div class="tw"><table><thead><tr><th>গাড়ি</th><th class="r">খেপ</th><th class="r">মোট</th><th class="r">কেজি প্রতি</th></tr></thead><tbody>
 ${rows.map(r=>`<tr class="${r===best?'hl':''}"><td><b>${r.n}</b>${r===best?' <span class="pill ok">কম খরচ</span>':''}<div class="tiny muted">${num(r.cap)} কেজি</div></td><td class="r">${bn(r.trips)}</td><td class="r"><b>${tk(r.cost)}</b></td><td class="r">${tk(r.cost/qty)}</td></tr>`).join('')}</tbody></table></div>${note('ভাড়ার হার নমুনা (লোডিং সহ)।')}`;
}

/* ---------- chat ---------- */
function chatInit(id){
 if(S.chats[id])return;const L=curL(),off=offerFor(id,L);
 S.chats[id]={lid:L.id,msgs:[{w:'them',t:`আস্সালামু আলাইকুম! আপনার ${CROPS[L.crop].bn} ${num(L.qty)} কেজির তালিকা দেখেছি। আমি ${tk(off)}/কেজি দিতে পারি। আপনার দাম কত?`}],agreed:null,counter:null,deal:false,typing:false};
}
function buyerReply(id,text,price){
 const ch=S.chats[id],L=S.listings.find(l=>l.id===ch.lid),b=BUY[id],off=offerFor(id,L),res=reserveFor(id,L);
 if(price!=null){
  if(price<=res){const f=Math.max(price,off);ch.agreed=f;ch.counter=null;return price<off?`আমি তো ${tk(off)} দিতেই রাজি ছিলাম। ${tk(off)}/কেজিতে ডিল করি। কনফার্ম করুন।`:`ঠিক আছে, ${tk(f)}/কেজিতে রাজি। ডিল কনফার্ম করুন।`;}
  const c=Math.min(res,Math.max(off,Math.round((price+off)/2)));ch.counter=c;ch.agreed=null;
  return c>=res?`${tk(price)} একটু বেশি হয়ে যাচ্ছে। আমার সর্বোচ্চ ${tk(c)}/কেজি।`:`${tk(price)} বাজারের তুলনায় বেশি। পাল্টা প্রস্তাব: ${tk(c)}/কেজি।`;
 }
 if(/পরিবহন|গাড়ি|ট্রাক|ভ্যান/.test(text))return b.tp;
 if(/টাকা|পেমেন্ট|কবে/.test(text))return 'পেমেন্ট: '+b.pay+'।';
 if(text==='__voice')return 'ভয়েস মেসেজ পেয়েছি, ধন্যবাদ। দামটা লিখে জানাবেন।';
 return 'ঠিক আছে। দাম বা পরিমাণ নিয়ে লিখুন।';
}
function chatSheet(id){
 const b=BUY[id],ch=S.chats[id],L=S.listings.find(l=>l.id===ch.lid);
 const msgs=ch.msgs.map(m=>{
  if(m.w==='sys')return `<div class="msg sys">${m.t}</div>`;
  if(m.v)return `<div class="msg ${m.w}"><div class="voice"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg><span class="wave">${[8,14,20,12,18,10,16,22,12,8,14,10].map(h=>`<i style="height:${h}px"></i>`).join('')}</span><span class="small">${m.v}</span></div></div>`;
  return `<div class="msg ${m.w}">${esc(m.t)}</div>`;}).join('');
 const sold=L.sold&&!ch.deal;
 const chips=[];
 if(ch.counter)chips.push(`<button class="chip" data-a="chatQuick" data-p="${ch.counter}">রাজি, ${tk(ch.counter)}</button>`);
 chips.push(`<button class="chip" data-a="chatQuick" data-p="${L.price}">${tk(L.price)}/কেজি চাই</button>`,`<button class="chip" data-a="chatQuick" data-t="পরিবহন কে দেবে?">পরিবহন কে দেবে?</button>`,`<button class="chip" data-a="chatQuick" data-t="টাকা কবে পাব?">টাকা কবে পাব?</button>`);
 return `<div class="sheet chat" role="dialog" aria-modal="true" aria-label="${b.n} এর সাথে চ্যাট">
  <div class="chat-h"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div style="min-width:0"><b>${b.n}</b> ${b.ver?'<span class="pill ok">যাচাইকৃত</span>':'<span class="pill warn">যাচাই বাকি</span>'}<div class="small muted">${CROPS[L.crop].bn} ${num(L.qty)} কেজি · প্রস্তাব ${tk(offerFor(id,L))}/কেজি</div></div><button class="x" data-a="close" aria-label="বন্ধ করুন">×</button></div>
   <div class="row"><button class="btn sm" disabled>ভয়েস কল <span class="pill plain">শীঘ্রই</span></button><button class="btn sm" disabled>ভিডিও কল <span class="pill plain">শীঘ্রই</span></button></div></div>
  <div class="chat-b" id="chatb">${msgs}${ch.typing?'<div class="typing">লিখছেন…</div>':''}</div>
  <div class="chat-f">
   ${ch.deal?`<div class="deal-strip"><b>ডিল সম্পন্ন</b><button class="btn primary sm" data-a="receipt" data-v="${L.id}">রসিদ দেখুন</button><button class="btn sm" data-a="toLogi">পরিবহন হিসাব করুন</button></div>`
    :sold?'<div class="deal-strip">এই তালিকা অন্য ক্রেতার কাছে বিক্রি হয়ে গেছে।</div>'
    :ch.agreed?`<div class="deal-strip"><span><b>${tk(ch.agreed)}/কেজি</b> এ রাজি, মোট ${tk(ch.agreed*L.qty)}</span><button class="btn primary sm" data-a="chatConfirm">ডিল কনফার্ম করুন</button></div>`:''}
   ${(ch.deal||sold)?'':`<div class="chips">${chips.join('')}</div>
   <form data-f="chat"><input type="text" id="cin" placeholder="লিখুন বা দাম বলুন (যেমন ২৩)" autocomplete="off" aria-label="বার্তা"><button class="btn primary" type="submit">পাঠান</button><button class="btn" type="button" data-a="chatVoice" aria-label="ভয়েস মেসেজ">ভয়েস</button></form>`}
  </div></div>`;
}
function renderChat(id){const m=$('#modal');if(m.hidden||S.openChat!==id)return;m.innerHTML=chatSheet(id);const b=$('#chatb');if(b)b.scrollTop=b.scrollHeight;}
function say(id,type,payload){
 const ch=S.chats[id];ch.msgs.push(payload);ch.typing=true;renderChat(id);
 setTimeout(()=>{ch.typing=false;let price=null;if(type==='p')price=payload.p;ch.msgs.push({w:'them',t:buyerReply(id,type==='v'?'__voice':(payload.t||''),price)});renderChat(id);},850);
}

/* ---------- modal / profile ---------- */
function openModal(html){const m=$('#modal');m.innerHTML=html;m.hidden=false;document.body.style.overflow='hidden';const f=m.querySelector('button,input');}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';S.openChat=null;document.body.style.overflow='';}
function profileSheet(){
 const p=S.profile;
 return `<div class="sheet" role="dialog" aria-modal="true" aria-label="কৃষক ও জমির তথ্য"><div class="sheet-h"><h2>কৃষক ও জমির তথ্য</h2><button class="x" data-a="close" aria-label="বন্ধ করুন">×</button></div>
 <p class="small muted">বদলালে সব মডিউলের হিসাব সাথে সাথে বদলে যাবে।</p>
 <div class="lbl">জেলা</div><div class="chips">${Object.keys(DIST).map(k=>chip(k,`data-a="setDistrict" data-v="${k}" data-sheet="1"`,k===p.district)).join('')}</div>
 <div class="lbl">ফসল</div><div class="chips">${CK.map(k=>chip(CROPS[k].bn,`data-a="pickCrop" data-v="${k}" data-sheet="1"`,k===p.crop)).join('')}</div>
 <label class="lbl" for="land">জমির পরিমাণ: <b id="landv">${dec(p.land)} একর</b></label><input type="range" id="land" min="0.5" max="10" step="0.5" value="${p.land}" data-c="land">
 <div class="lbl">মাটি</div><div class="chips">${Object.keys(SOIL).map(k=>chip(SOIL[k],`data-a="setSoil" data-v="${k}" data-sheet="1"`,k===p.soil)).join('')}</div>
 <div style="margin-top:20px"><button class="btn primary" data-a="close">ঠিক আছে</button></div></div>`;
}

/* ---------- render / routing ---------- */
function setGuardianForCrop(){S.g={key:S.profile.crop,photo:null,scanning:false};}
function onProfile(sheet){
 S.mCrop=S.profile.crop;S.prefill=null;S.seed=S.seed;
 if(!S.g.photo)setGuardianForCrop();
 render();if(sheet)openModal(profileSheet());
}
function render(){
 const r=S.route;
 $('#dnav').innerHTML=NAV.map(n=>`<a href="#${n.id}" ${n.id===r?'aria-current="page"':''}><b>${n.bn}</b>${n.en?`<span>${n.en}</span>`:''}</a>`).join('');
 $('#bnav .wrap').innerHTML=NAV.map(n=>`<a href="#${n.id}" ${n.id===r?'aria-current="page"':''}>${ic(n.id)}<span>${n.short}</span></a>`).join('');
 $('#app').innerHTML=(V[r]||V.home)();
 hydrate();
}
function hydrate(){
 const cb=$('#fcChart');if(cb){cb.innerHTML=priceChart(S.mCrop,localMk(),Math.max(300,Math.floor(cb.clientWidth)));}
}
function route(){const h=location.hash.slice(1);S.route=V[h]?h:'home';render();window.scrollTo(0,0);}
function go(r){if(location.hash==='#'+r)route();else location.hash=r;}

/* ---------- events ---------- */
const A={
 profile:()=>openModal(profileSheet()),
 close:closeModal,
 reset:()=>{Object.assign(S,{profile:{name:'রহিম মিয়া',district:'রংপুর',crop:'potato',land:2,soil:'loam'},yS:'normal',pS:'normal',mTab:'board',mCrop:'potato',selL:null,listings:[],deals:[],chats:{},prefill:null,seed:1,g:{key:'potato',photo:null,scanning:false},hold:3});render();toast('ডিল ও চ্যাট মুছে নতুন করে শুরু হয়েছে');},
 pickCrop:t=>{S.profile.crop=t.dataset.v;onProfile(!!t.dataset.sheet);},
 setDistrict:t=>{S.profile.district=t.dataset.v;S.prefill=null;render();if(t.dataset.sheet)openModal(profileSheet());},
 setSoil:t=>{S.profile.soil=t.dataset.v;render();if(t.dataset.sheet)openModal(profileSheet());},
 yS:t=>{S.yS=t.dataset.v;render();},pS:t=>{S.pS=t.dataset.v;render();},
 moist:()=>{S.seed++;render();},
 speak:t=>speak(t.dataset.t),
 case:t=>{S.g={key:t.dataset.v,photo:null,scanning:true};render();setTimeout(()=>{S.g.scanning=false;if(S.route==='guardian')render();},900);},
 officer:()=>toast('রিপোর্ট উপজেলা কৃষি অফিসারের কাছে পাঠানোর সুবিধা শীঘ্রই আসছে'),
 toListing:()=>{const c=S.profile.crop,y=yieldCalc(c);S.prefill={crop:c,qty:Math.round(y.yieldKg*.85/10)*10,price:Math.round(localPrice(c))};S.mCrop=c;S.mTab='listing';go('market');},
 mTab:t=>{S.mTab=t.dataset.v;render();},
 mCrop:t=>{S.mCrop=t.dataset.v;render();},
 rmL:t=>{S.listings=S.listings.filter(l=>l.id!==t.dataset.v);S.selL=null;render();},
 viewBuyers:t=>{S.selL=t.dataset.v;S.mTab='buyers';render();},
 toLogi:()=>{closeModal();S.mTab='logi';go('market');},
 openChat:t=>{const id=t.dataset.v;chatInit(id);S.openChat=id;openModal(chatSheet(id));const b=$('#chatb');if(b)b.scrollTop=b.scrollHeight;},
 chatQuick:t=>{const id=S.openChat,ch=S.chats[id];if(t.dataset.p){const p=+t.dataset.p;say(id,'p',{w:'me',t:`${tk(p)}/কেজিতে দিতে পারি।`,p});}else say(id,'t',{w:'me',t:t.dataset.t});},
 chatVoice:()=>{const id=S.openChat;say(id,'v',{w:'me',v:'০:'+bn(String(5+Math.floor(Math.random()*8)).padStart(2,'0'))});},
 chatConfirm:()=>{
  const id=S.openChat,ch=S.chats[id],L=S.listings.find(l=>l.id===ch.lid);if(L.sold)return;
  const mid=midPrice(L.crop),p=ch.agreed;
  S.deals.push({lid:L.id,buyer:id,crop:L.crop,qty:L.qty,price:p,total:p*L.qty,gain:(p-mid)*L.qty,mid,at:Date.now(),no:'KS-'+String(Date.now()).slice(-6)});
  L.sold=true;ch.deal=true;ch.msgs.push({w:'sys',t:`ডিল নিশ্চিত: ${tk(p)}/কেজি, মোট ${tk(p*L.qty)}`});renderChat(id);render();
 }
};
function speak(t){
 try{const s=window.speechSynthesis;if(!s){toast('এই ব্রাউজারে ভয়েস সুবিধা নেই');return;}
  const v=s.getVoices().find(x=>/^bn/i.test(x.lang));
  if(!v){toast('এই ডিভাইসে বাংলা ভয়েস নেই। আসল অ্যাপে রেকর্ড করা ভয়েস অ্যালার্ট যাবে।');return;}
  s.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;s.speak(u);}catch(e){toast('ভয়েস চালু করা যায়নি');}
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');
 if(t&&A[t.dataset.a]){A[t.dataset.a](t,e);return;}
 if(e.target.id==='modal')closeModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});
document.addEventListener('input',e=>{
 const c=e.target.dataset.c;
 if(c==='land'){S.profile.land=+e.target.value;$('#landv').textContent=dec(S.profile.land)+' একর';}
 if(c==='hold'){S.hold=+e.target.value;$('#holdv').textContent=bn(S.hold)+' দিন';const q=Math.round(yieldCalc(S.mCrop).yieldKg*.85/10)*10;$('#holdOut').innerHTML=holdOut(S.mCrop,q);}
 if(c==='logi'){S.lgm=$('#lgm').value;$('#logiOut').innerHTML=logiOut(S.lgm,Math.max(50,+$('#lgq').value||50));}
});
document.addEventListener('change',e=>{
 const c=e.target.dataset.c;
 if(c==='land'){S.prefill=null;render();}
 if(c==='gphoto'||c==='lphoto'){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{
   if(c==='gphoto'){S.g={key:S.profile.crop,photo:rd.result,scanning:false,ai:null};render();aiRun();}
   else{S.lphoto=rd.result;toast('ছবি যোগ হয়েছে');}
  };rd.readAsDataURL(f);
 }
});
document.addEventListener('submit',e=>{
 const f=e.target.dataset.f;if(!f)return;e.preventDefault();
 if(f==='listing'){
  const l={id:'l'+Date.now(),crop:$('#lcrop').value,qty:Math.max(1,+$('#lqty').value),price:Math.max(1,+$('#lprice').value),grade:$('#lgrade').value,ready:$('#lready').value,photo:S.lphoto||null,sold:false};
  S.lphoto=null;S.listings.push(l);S.selL=l.id;S.prefill=null;S.mCrop=l.crop;S.mTab='buyers';render();toast('তালিকায় যোগ হয়েছে, ক্রেতারা প্রস্তাব পাঠিয়েছে');
 }
 if(f==='chat'){
  const inp=$('#cin'),v=inp.value.trim();if(!v)return;const id=S.openChat;
  const m=v.replace(/[০-৯]/g,d=>BD.indexOf(d)).match(/\d+(\.\d+)?/),n=m?+m[0]:null;
  if(n!=null&&n>=5&&n<=500)say(id,'p',{w:'me',t:v,p:Math.round(n)});else say(id,'t',{w:'me',t:v});
 }
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(hydrate,150);});
window.addEventListener('hashchange',route);
route();
})();
</script>
